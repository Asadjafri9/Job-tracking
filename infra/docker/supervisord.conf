[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=rolevo

[program:api]
command=/srv/api/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1
directory=/srv/api
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:worker]
command=/srv/api/.venv/bin/python -m app.worker.runner
directory=/srv/api
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:scheduler]
command=/srv/api/.venv/bin/python -m app.worker.scheduler
directory=/srv/api
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=30
