name: Build and publish image

# AZ-002: immutable image build with federated OIDC — no long-lived
# subscription credentials. The `staging` environment must be protected and
# the Azure federated credential configured by the operator before this
# workflow can authenticate; it fails closed without them.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
  push:
    branches: [work]
    paths:
      - "infra/docker/**"
      - "apps/api/**"
      - "apps/web/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          load: true
          tags: rolevo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push:
    name: Push to registry via federated OIDC
    needs: build
    # Pushes only happen through a manual dispatch into the protected
    # `staging` environment; branch pushes validate the build only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Azure login (federated, operator-configured)
        uses: azure/login@a457da7ea1b43c23378ab5d3ed97f9e3d3bce0fb # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push immutable image with attestations
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/rolevo:${{ github.sha }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Record pushed digest for rollback reference
        run: |
          docker buildx imagetools inspect \
            "${{ vars.ACR_LOGIN_SERVER }}/rolevo:${{ github.sha }}" \
            --format '{{.Manifest.Digest}}' >> "$GITHUB_STEP_SUMMARY"
