[project]
name = "job-tracking-api"
version = "0.1.0"
description = "API foundation for the job tracking workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.17.0",
  "azure-storage-blob==12.26.0",
  "fastapi==0.119.0",
  "psycopg[binary]==3.3.0",
  "pydantic==2.12.0",
  "sqlalchemy==2.0.44",
  "uvicorn[standard]==0.37.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==9.1.1",
  "ruff==0.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
