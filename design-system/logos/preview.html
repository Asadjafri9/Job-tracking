<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proposed Rolevo R logo variants</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; color: #202824; background: #f7f8f6; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 820px; margin: auto; }
    section { padding: 24px; margin: 16px 0; border: 1px solid #d4ddd6; border-radius: 14px; background: #fff; }
    h1 { font-size: 28px; }
    h2 { font-size: 16px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 32px; }
    .size { display: flex; align-items: center; gap: 10px; padding: 12px; background: #f7f8f6; }
    .dark { color: white; background: #202824; }
    .dark section { background: #202824; border-color: #526157; }
    .dark .size { background: #303b34; }
    .tag { color: #526157; font-size: 12px; }
    .dark .tag { color: #d8e0da; }
  </style>
</head>
<body>
  <main>
    <p class="tag">Owner-selected product identity · DGN-006 · External clearance not claimed</p>
    <h1>Rolevo R variants</h1>
    <section>
      <h2>Horizontal primary</h2>
      <img src="rolevo-horizontal.svg" alt="Rolevo horizontal logo" width="224" height="48">
      <h2>Symbol at browser-scale sizes</h2>
      <div class="row">
        <div class="size"><img src="rolevo-symbol.svg" alt="" width="16" height="16"><span class="tag">16 px toolbar</span></div>
        <div class="size"><img src="rolevo-symbol.svg" alt="" width="24" height="24"><span class="tag">24 px compact header</span></div>
        <div class="size"><img src="rolevo-symbol.svg" alt="" width="32" height="32"><span class="tag">32 px panel</span></div>
      </div>
      <h2>Monochrome</h2>
      <img src="rolevo-monochrome.svg" alt="Proposed Rolevo monochrome logo" width="224" height="48">
    </section>
    <section class="dark">
      <h2>Reversed on dark surface</h2>
      <img src="rolevo-reversed.svg" alt="Proposed Rolevo reversed logo" width="224" height="48">
      <div class="row">
        <div class="size"><img src="rolevo-reversed.svg" alt="" width="75" height="16"><span class="tag">Small reversed wordmark</span></div>
      </div>
    </section>
  </main>
</body>
</html>
